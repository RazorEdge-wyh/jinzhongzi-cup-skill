name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional deps
        run: python -m pip install --upgrade pip pyyaml python-docx

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Agent Skills spec validation
        run: python tools/validate_skill.py skills

      - name: Linter fixtures (exit codes)
        shell: bash
        run: |
          set -euo pipefail
          python skills/jinzhongzi-cup/scripts/check_submission.py --version
          python skills/jinzhongzi-cup/scripts/check_submission.py --mapping
          python skills/jinzhongzi-cup/scripts/check_submission.py tests/fixtures/plan_good.md --kind plan
          if python skills/jinzhongzi-cup/scripts/check_submission.py tests/fixtures/plan_bad.md --kind plan; then
            echo "bad fixture should have failed"; exit 1
          else
            echo "bad fixture failed as expected"
          fi
          python skills/jinzhongzi-cup/scripts/check_submission.py tests/fixtures/paper_bad_citations.md --kind paper --json > /tmp/report.json || true
          python - <<'PY'
          import json
          data = json.load(open('/tmp/report.json', encoding='utf-8'))
          assert data['errors'], 'expected citation errors in fixture'
          print('json report ok:', len(data['errors']), 'errors')
          PY

      - name: Byte-compile
        run: python -m compileall -q skills tools tests
